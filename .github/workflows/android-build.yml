# Builds the Android APK on GitHub's own servers (no waiting in the Expo build queue)
# and signs it with the same key EAS already holds for your app, so it installs as an UPDATE.
#
# Run it: GitHub repo > Actions > "Build Android APK" > Run workflow,
# or push a tag like v1.1.0 to also attach the APK to a GitHub Release.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # lets the job create a Release when you push a tag

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17   # if the log complains about the Java version, try 21

      - uses: android-actions/setup-android@v3

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Build the APK on this runner
        run: eas build --platform android --profile preview --local --non-interactive --output ./ledger.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ledger-apk
          path: ledger.apk

      - name: Attach the APK to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" ledger.apk --title "Ledger $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Prefer EAS's own servers instead? Replace the "Build the APK" step with:
#   - run: eas build --platform android --profile preview --non-interactive --no-wait
