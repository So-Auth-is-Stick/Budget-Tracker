# Builds the Android APK on GitHub's own servers (no waiting in the Expo build queue)
# and signs it with the same key EAS already holds for your app, so it installs as an UPDATE.
#
# Run it: GitHub repo > Actions > "Build Android APK" > Run workflow,
# or push a tag like v1.1.0 to also attach the APK to a GitHub Release.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write   # lets the job create a Release when you push a tag

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17   # Use 17 for Expo SDK 51-53; bump to 21 if using newer Gradle 8.10+

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Expo and EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm     # Explicitly use npm (default is yarn)
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build the APK on this runner
        run: eas build --platform android --profile preview --local --non-interactive --output ./ledger.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: ledger-apk
          path: ledger.apk

      - name: Attach the APK to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" ledger.apk --title "Ledger $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}