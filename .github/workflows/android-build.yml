# Builds the Android APK on GitHub's servers and signs it with the key EAS already holds
# for your app, so it installs as an UPDATE over the old app (your data stays).
#
# Runs by itself after every push to main (skip one by putting [skip ci] in the commit message),
# or by hand: GitHub repo > Actions > "Build Android APK" > Run workflow.
# Push a tag like v2.1.0 to also attach the APK to a GitHub Release.
#
# If this one keeps failing, use "Build Android APK (Expo cloud)" instead - same result, fewer moving parts.
name: Build Android APK

on:
  workflow_dispatch:          # the manual "Run workflow" button still works
  push:
    branches: [main]          # build after every push to main
    tags: ['v*']              # a tag like v2.1.0 also attaches the APK to a Release
    paths-ignore:             # ...but not when only docs/screenshots changed
      - '**.md'
      - 'docs/**'

# If you push again while a build is still running, cancel the old one and build the newest
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # lets the job create a Release when you push a tag

env:
  CI: "1"
  EAS_NO_VCS: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Plain-English checks, so a missing piece is named instead of hidden in a wall of log text.
      - name: Check the project is set up
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -n "${{ secrets.EXPO_TOKEN }}" ] || fail "EXPO_TOKEN secret is missing. Repo > Settings > Secrets and variables > Actions > New repository secret."
          [ -f package.json ] || fail "package.json is not at the top of the repo. Upload the contents of the BudgetTracker folder, not the folder itself."
          [ -f app.json ] || fail "app.json is missing from the repo."
          [ -f eas.json ] || fail "eas.json is missing from the repo."
          grep -q '"preview"' eas.json || fail 'eas.json has no "preview" profile.'
          grep -q '"projectId"' app.json || fail 'app.json has no extra.eas.projectId. Run "eas init" once on your computer, then commit app.json.'
          node -v && npm -v
          eas whoami

      # `npm ci` stops if package-lock.json disagrees with package.json (yours still listed
      # drizzle, reanimated, sqlite... that were removed). `npm install` just repairs it.
      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Build the APK on this runner
        run: eas build --platform android --profile preview --local --non-interactive --output "$GITHUB_WORKSPACE/ledger.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ledger-apk
          path: ledger.apk
          if-no-files-found: error

      - name: Attach the APK to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" ledger.apk --title "Ledger $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
